<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 w-100 max-w-md border-0" style="border-radius: 15px; background: linear-gradient(45deg, #007bff, #6c757d);">
    <div class="card-body text-white">
      <h2 class="card-title mb-3 text-center font-weight-bold">Iniciar Sesión</h2>
      <p class="card-subtitle mb-4 text-center font-italic">Sistema de empleados</p>

      <form (ngSubmit)="onSubmit()" class="form">
        <div class="form-group">
          <input
            type="text"
            class="form-control form-control-lg"
            required
            [(ngModel)]="usuario"
            name="usuario"
            placeholder="Usuario"
            style="border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);"
          />
        </div>

        <div class="form-group mt-3">
          <input
            type="password"
            class="form-control form-control-lg"
            required
            [(ngModel)]="password"
            name="password"
            placeholder="Contraseña"
            style="border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);"
          />
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
          <a routerLink="/registrer" class="text-warning font-weight-bold">Registrar</a>
          <button type="submit" class="btn btn-warning btn-lg font-weight-bold" style="border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);">
            Ingresar
          </button>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert" style="border-radius: 10px;">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
